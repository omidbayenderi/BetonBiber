<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>404 | BetonBiber</title>
    <script>
      var pathname = window.location.pathname;
      var path = pathname.startsWith('/BetonBiber')
        ? pathname.slice('/BetonBiber'.length)
        : pathname;
      sessionStorage.setItem('betonbiber_redirect_path', path.replace(/\/+$/, '') || '/');
      window.location.replace('/');
    </script>
  </head>
  <body>
    <p>Die Seite wird geladen...</p>
  </body>
</html>
