<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>404 | BetonBiber</title>
    <script>
      var base = '/BetonBiber';
      var path = window.location.pathname.startsWith(base)
        ? window.location.pathname.slice(base.length)
        : window.location.pathname;
      sessionStorage.setItem('betonbiber_redirect_path', path.replace(/\/+$/, '') || '/');
      window.location.replace(base + '/');
    </script>
  </head>
  <body>
    <p>Die Seite wird geladen...</p>
  </body>
</html>
